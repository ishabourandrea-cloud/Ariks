<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Illdy Header</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 font-sans antialiased">

  <header class="fixed top-0 left-0 w-full z-50 bg-slate-900/90 backdrop-blur-md border-b border-white/10 text-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        
        <!-- Brand Logo -->
        <a href="#" class="text-2xl font-bold tracking-wider text-white hover:opacity-90 transition-opacity">
          Illdy<span class="text-yellow-500">.</span>
        </a>

        
        <input type="checkbox" id="menu-toggle" class="peer hidden" />

        <label 
          for="menu-toggle" 
          class="md:hidden cursor-pointer p-2 rounded-md hover:bg-white/10 transition-colors text-white"
          aria-label="Toggle menu"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </label> 
        <nav class="hidden peer-checked:flex flex-col md:flex md:flex-row md:items-center space-y-4 md:space-y-0 md:space-x-8 absolute md:relative top-20 md:top-0 left-0 w-full md:w-auto bg-slate-900 md:bg-transparent p-6 md:p-0 border-b border-white/10 md:border-none shadow-xl md:shadow-none transition-all duration-300">
          <a href="#about" class="text-xs uppercase font-bold tracking-widest text-white/90 hover:text-yellow-500 transition-colors">
            About
          </a>
          <a href="#portfolio" class="text-xs uppercase font-bold tracking-widest text-white/90 hover:text-yellow-500 transition-colors">
            Portfolio
          </a>
          <a href="#testimonials" class="text-xs uppercase font-bold tracking-widest text-white/90 hover:text-yellow-500 transition-colors">
            Testimonials
          </a>
          <a href="#services" class="text-xs uppercase font-bold tracking-widest text-white/90 hover:text-yellow-500 transition-colors">
            Services
          </a>
          <a href="#blog" class="text-xs uppercase font-bold tracking-widest text-white/90 hover:text-yellow-500 transition-colors">
            Blog
          </a>
          <a href="#team" class="text-xs uppercase font-bold tracking-widest text-white/90 hover:text-yellow-500 transition-colors">
            Our Team
          </a>
          <a href="#contact" class="text-xs uppercase font-bold tracking-widest text-white/90 hover:text-yellow-500 transition-colors">
            Contact
          </a>
        </nav>

      </div>
    </div>
  </header>

</body>
</html>
